[workspace]
members = [
    "distribution",
    "libbridge",
    "libcgroups",
    "libcni",
    "libcontainer",
    "libfuse-fs",
    "rfuse3",
    "libipam",
    "rkb",
    "rkl",
    "rks",
    "libscheduler",
    "common",
    "slayerfs"
]

default-members = ["distribution", "rkl", "libbridge", "libipam", "rkb", "libnetwork","rks"]
resolver = "1"

[workspace.dependencies]
# internal path crates
distribution = { path = "distribution" }
libbridge = { path = "libbridge" }
libcgroups = { path = "./libcgroups", default-features = false }
libcni = { path = "libcni" }
libcontainer = { path = "libcontainer" }
libfuse-fs = { path = "libfuse-fs" }
rfuse3 = { path = "rfuse3" }
libipam = { path = "libipam" }
rkb = { path = "rkb" }
rkl = { path = "rkl" }
rks = { path = "rks" }
libscheduler = { path = "libscheduler" }
common = { path = "common" }
slayerfs = { path = "slayerfs" }
libnetwork = { path = "libnetwork" }

# common external dependencies (versions chosen from your manifests)
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = "0.8.4"
axum-extra = { version = "0.10.1", features = ["typed-header"] }
bcrypt = "0.17.1"
clap = { version = "4.5.32", features = ["derive"] }
chrono = { version = "0.4.39", default-features = false, features = ["clock"] }
dotenvy = "0.15.7"
futures = "0.3.31"
hex = "0.4.3"
jsonwebtoken = "9.3.1"
oci-spec = "0.8.0"
regex = { version = "1.11.1", default-features = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.8"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls","sqlite","postgres","macros","migrate","chrono","uuid"] }
tokio = { version = "1.44.0", features = ["full"] }
tokio-util = { version = "0.7.13", features = ["io"] }
thiserror = "2.0.12"
tower-http = { version = "0.6.6", features = ["trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter","time","fmt"] }
reqwest = { version = "0.12.23", features = ["json"] }
rand = "0.9.2"
iptables = "0.6"
cni-plugin = { version = "0.2.1", features = ["with-smol"] }
