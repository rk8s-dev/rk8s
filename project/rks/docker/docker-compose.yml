services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    command:
      - etcd
      - --name
      - etcd0
      - --data-dir
      - /etcd-data
      - --listen-client-urls
      - http://0.0.0.0:2379
      - --advertise-client-urls
      - http://etcd:2379
      - --listen-peer-urls
      - http://0.0.0.0:2380
      - --initial-advertise-peer-urls
      - http://etcd:2380
      - --initial-cluster
      - etcd0=http://etcd:2380
      - --initial-cluster-state
      - new
      - --initial-cluster-token
      - rks-etcd-cluster
    environment:
      - ETCDCTL_API=3
    ports:
      - "2379:2379"
      - "2380:2380"
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s

  rks:
    image: rks-local
    build:
      context: ../..
      dockerfile: rks/docker/Dockerfile
    depends_on:
      etcd:
        condition: service_healthy
    environment:
      - RKS_CONFIG=/opt/rks/config.yaml
      - RUST_LOG=info
    volumes:
      - ./config.yaml:/opt/rks/config.yaml:ro
    ports:
      - "50051:50051"
      - "50051:50051/udp"
