apiVersion: v1
kind: Job
metadata:
  name: job-parallel
  namespace: default
spec:
  completionMode: NonIndexed
  completions: 3
  parallelism: 2
  backoffLimit: 4
  template:
    metadata:
      labels: {}
    spec:
      restart_policy: Never
      containers:
        - name: worker
          image: lingbou/perl:5.34.0
          args:
            - perl
            - -e
            - sleep 30; exit 0
