[package]
name = "rkl"
version = "0.1.0"
edition = "2024"
authors = ["rk8s-dev team"]
description = "Implementation of CRI interface functionality based on Youki"
repository = "https://github.com/r2cn-dev/rk8s/tree/main/project/rkl"

[lib]
name = "rkl"
path = "src/lib.rs"

[[bin]]
name = "rkl"
path = "src/main.rs"

[dependencies]
common = { workspace = true }
libnetwork = { workspace = true }
rkb = { workspace = true }
libipam = { workspace = true }
libcgroups = { workspace = true }
libcontainer = { workspace = true }
clap = { workspace = true, features = ["derive"] }
tracing = { workspace = true, features = ["attributes"] }
tracing-subscriber = { workspace = true, features = ["json","env-filter"] }
tokio = { workspace = true, features = ["rt-multi-thread","macros","full"] }
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true, features = ["v4"] }
nix = { workspace = true, features = ["fs","mount"] }
libcni = { workspace = true }
libfuse-fs = { workspace = true }
anyhow = { workspace = true }
protobuf = { workspace = true }
liboci-cli = { workspace = true }
tracing-journald = { workspace = true }
serde_json = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
serde_yaml = { workspace = true }
prost-types = { workspace = true }
http-body = { workspace = true }
hyper = { workspace = true }
serial_test = { workspace = true }
oci-spec = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
sha256 = { workspace = true }
futures = { workspace = true }
daemonize = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
tabwriter = { workspace = true }
bincode = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
gethostname = { workspace = true }
sysinfo = { workspace = true }
ipnetwork = { workspace = true }
log = { workspace = true }
lazy_static = { workspace = true }
regex = { workspace = true }
dotenvy = { workspace = true }
netlink-packet-route = { workspace = true }
json = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
cni-plugin = { workspace = true }
common = { path = "../common" }
libnetwork = { path = "../libnetwork", version = "0.1.0" }
rkb = { path = "../rkb", version = "0.1.0" }
libipam = { path = "../libipam" }
libcgroups = { path = "../libcgroups", version = "0.5.1" }
libcontainer = { path = "../libcontainer", version = "0.5.1" }
clap = { version = "4.5", features = ["derive", "env"] }
tracing = { version = "0.1.41", features = ["attributes"] }
