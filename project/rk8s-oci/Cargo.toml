[package]
name = "rk8s-oci"
version = "0.1.0"
edition = "2024"
authors = ["rk8s-dev team"]
description = "Rust-friendly OCI image primitives for rk8s"
repository = "https://github.com/r2cn-dev/rk8s/tree/main/project/rk8s-oci"
license = "MIT OR Apache-2.0"
readme = "README.md"

[workspace]

[lib]
name = "rk8s_oci"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"

[dev-dependencies]
serde_json = "1.0.145"
