version: "3.9"

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    command:
      - etcd
      - --name
      - etcd0
      - --data-dir
      - /etcd-data
      - --listen-client-urls
      - http://0.0.0.0:2379
      - --advertise-client-urls
      - http://etcd:2379
      - --listen-peer-urls
      - http://0.0.0.0:2380
      - --initial-advertise-peer-urls
      - http://etcd:2380
      - --initial-cluster
      - etcd0=http://etcd:2380
      - --initial-cluster-state
      - new
      - --initial-cluster-token
      - rusty-vault-etcd
    environment:
      - ETCDCTL_API=3
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s
    volumes:
      - etcd-data:/etcd-data

  vault:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      etcd:
        condition: service_healthy
    environment:
      - VAULT_ADDR=http://127.0.0.1:8200
    ports:
      - "8200:8200"
    volumes:
      - vault-state:/opt/rusty_vault/state

volumes:
  etcd-data:
  vault-state:
