name: rkforge lifecycle tests

on:
  pull_request:
    paths:
      - "project/rkforge/**"
      - "project/libruntime/**"
      - "project/libcontainer/**"
      - "project/common/**"
      - "project/Cargo.toml"
      - "project/Cargo.lock"
      - ".github/workflows/rkforge-lifecycle.yml"
  push:
    branches:
      - main
    paths:
      - "project/rkforge/**"
      - "project/libruntime/**"
      - "project/libcontainer/**"
      - "project/common/**"
      - "project/Cargo.toml"
      - "project/Cargo.lock"
      - ".github/workflows/rkforge-lifecycle.yml"

permissions:
  contents: read

concurrency:
  group: rkforge-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    runs-on: [self-hosted]
    timeout-minutes: 45

    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: stable
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: project

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            protobuf-compiler \
            libssl-dev \
            libseccomp-dev \
            fuse3 \
            libfuse3-dev

      - name: Run rkforge lifecycle tests (sync)
        run: |
          cd project
          sudo --preserve-env=PATH,RUSTUP_TOOLCHAIN,CARGO_TERM_COLOR,RUST_BACKTRACE \
            RKFORGE_LIFECYCLE_TESTS=1 \
            cargo test -p rkforge --test test_container_lifecycle -- --test-threads=1
