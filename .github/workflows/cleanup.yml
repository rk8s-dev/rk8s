name: Self-hosted runner cleanup

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: [self-hosted]
    steps:
      - name: Clean /tmp
        run: |
          sudo rm -rf /tmp/* /tmp/.* 2>/dev/null || true
          sudo mkdir -p -m 1777 /tmp

      - name: Clean cargo build artifacts
        run: |
          cargo clean --manifest-path "${{ github.workspace }}/project/Cargo.toml" 2>/dev/null || true

      - name: Report disk usage
        run: |
          echo "=== /tmp ==="
          du -sh /tmp 2>/dev/null || true
          echo "=== workspace ==="
          du -sh "${{ github.workspace }}" 2>/dev/null || true
          echo "=== disk ==="
          df -h /
