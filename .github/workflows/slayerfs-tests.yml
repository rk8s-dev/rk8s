name: slayerfs tests

on:
  pull_request:
    paths:
      - "project/slayerfs/**"
      - "project/rfuse3/**"
      - "project/Cargo.toml"
      - "project/Cargo.lock"
  push:
    branches:
      - main
    paths:
      - "project/slayerfs/**"
      - "project/rfuse3/**"
      - "project/Cargo.toml"
      - "project/Cargo.lock"

jobs:
  unit-and-integration:
    name: cargo test -p slayerfs
    runs-on: [self-hosted]
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            fuse3 \
            pkg-config \
            libssl-dev \
            protobuf-compiler \
            qemu-system-x86 \
            qemu-utils \
            libvirt-clients \
            guestfish \
            xorriso

      - name: Run tests
        run: |
          cd project
          cargo test -p slayerfs

      - name: Install nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked --force

      - name: Replay fuzz corpus (fs_ops)
        timeout-minutes: 15
        run: |
          cd project/slayerfs
          CORPUS_COUNT=$(find fuzz/corpus/fs_ops -type f | wc -l)
          echo "Replaying ${CORPUS_COUNT} corpus inputs"
          cargo +nightly fuzz run --sanitizer=none fs_ops fuzz/corpus/fs_ops -- -runs=${CORPUS_COUNT} -max_len=1024 -rss_limit_mb=1024 -print_final_stats=1
